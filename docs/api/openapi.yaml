  /:
    get:
      summary: Root Health Check
      description: 提供应用的基本信息和健康状态。
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AddRawTermCandidateRequest:
      properties:
        term:
          type: string
          title: Term
        normalizedTerm:
          anyOf:
          - type: string
          - type: 'null'
          title: Normalizedterm
        source:
          type: string
          title: Source
          default: AI_RUN_DETAIL
      type: object
      required:
      - term
      title: AddRawTermCandidateRequest
    AddRawTermCandidateResponse:
      properties:
        candidateId:
          type: integer
          title: Candidateid
        term:
          type: string
          title: Term
        status:
          type: string
          title: Status
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - candidateId
      - term
      - status
      - createdAt
