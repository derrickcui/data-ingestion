          - type: string
          - type: 'null'
          title: Docid
      - name: term
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Term
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: createdAt
          title: Sortby
      - name: sortOrder
        in: query
        required: false
        schema:
          type: string
          default: desc
          title: Sortorder
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
