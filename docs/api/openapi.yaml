openapi: 3.1.0
info:
  title: Geelink Data Ingestion System
  version: 1.1.0
paths:
  /ingest/upload:
    post:
      tags:
      - 资源上传导入
      summary: 专用文件上传接口（File Ingestion）
      description: '接收文件和可选元数据，进行同步摄取。

        Content-Type 必须是 multipart/form-data。'
      operationId: upload_ingest_upload_post
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: embedding provider
          title: Provider
        description: embedding provider
      - name: source_system
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 来源系统标识，用于 Doc ID 生成
          title: Source System
        description: 来源系统标识，用于 Doc ID 生成
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_ingest_upload_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ingest/ingest:
    post:
      tags:
      - 资源上传导入
      summary: 统一结构化数据摄取入口（支持单对象或数组）
      description: '接收结构化 JSON Body：

        - 单个对象

        - 或对象数组

        批量处理文本、URI/Base64/Web内容'
      operationId: ingest_structured_ingest_ingest_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/IngestStructuredRequest'
              - items:
                  $ref: '#/components/schemas/IngestStructuredRequest'
                type: array
              title: Request
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/ingest_email:
    post:
      tags:
      - email导入
      summary: 从邮箱抓取邮件并入库
      operationId: ingest_email_email_ingest_email_post
      requestBody:
        content:
